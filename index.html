<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Tracker</title>
</head>
<body>
    <form id="formulario">
        <div>
            <label id="label-titulo" for="titulo">Título:</label>
            <input type="text" id="titulo" required />
        </div>
        <div>
            <label id="label-autor" for="autor">Autor:</label>
            <input type="text" id="autor" required />
        </div>
        <div>
            <label id="label-capa" for="capa">URL da Capa:</label>
            <input type="url" id="capa" />
        </div>
        <div>
            <label id="label-nota" for="nota">Nota:</label>
            <input type="number" id="nota" min="0" max="10" required />
        </div>
        <div class="botao">
            <button id="botao" type="submit">Adicionar Livro</button>
        </div>
        <div id="lista" class="lista-livros">
        </div>
    </form>
    <script src= "script.js"></script>
</body>
</html>
